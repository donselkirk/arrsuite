name: Check Community Scripts Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: arrsuite-upstream-review
  cancel-in-progress: false

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resume existing review branch
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: automation/upstream-review
        run: |
          resumed=false
          pr_number="$(gh pr list --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin "${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
            git checkout -B "$REVIEW_BRANCH" "origin/${REVIEW_BRANCH}"
            git merge --no-edit origin/main
            resumed=true
          fi
          echo "resumed=$resumed" >>"$GITHUB_OUTPUT"

      - name: Prepare reviewed upstream candidate
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash tools/prepare-upstream-review.sh
          result=$?
          set -e
          state="failure"
          application_changes="false"
          [[ -r upstream-report/result.env ]] && source upstream-report/result.env
          echo "state=$state" >>"$GITHUB_OUTPUT"
          echo "application_changes=$application_changes" >>"$GITHUB_OUTPUT"
          echo "exit_code=$result" >>"$GITHUB_OUTPUT"

      - name: Add report to workflow summary
        if: always()
        run: |
          if [[ -r upstream-report/summary.md ]]; then
            cat upstream-report/summary.md >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Upstream review stopped before a report could be generated." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-scripts-upstream-report
          path: upstream-report/

      - name: Validate candidate
        if: steps.prepare.outputs.state == 'candidate' && steps.prepare.outputs.exit_code == '0'
        env:
          ARRSUITE_ALLOW_PENDING_UPSTREAM_REVIEW: "1"
        run: |
          bash tools/build-artifacts.sh
          bash tests/static-checks.sh
          git diff --check

      - name: Create or refresh review PR
        if: steps.prepare.outputs.state == 'candidate' && steps.prepare.outputs.exit_code == '0' && steps.prepare.outputs.application_changes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: automation/upstream-review
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.resume.outputs.resumed }}" != "true" ]]; then
            git fetch origin "${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}" || true
            git checkout -B "$REVIEW_BRANCH"
          fi
          git add tools/upstream-lock.json vendor/community-scripts/misc
          if ! git diff --cached --quiet; then
            git commit -m "chore: review Community Scripts upstream changes"
          fi
          if [[ "${{ steps.resume.outputs.resumed }}" == "true" ]]; then
            if [[ "$(git rev-list --count "origin/${REVIEW_BRANCH}..HEAD")" -gt 0 ]]; then
              git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"
            fi
          else
            git push --force-with-lease origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          fi

          pr_number="$(gh pr list --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$REVIEW_BRANCH" \
              --title "chore: review Community Scripts upstream changes" \
              --body-file upstream-report/pr-body.md \
              --assignee donselkirk \
              --reviewer donselkirk
          else
            gh pr edit "$pr_number" \
              --body-file upstream-report/pr-body.md \
              --add-assignee donselkirk
            gh pr edit "$pr_number" --add-reviewer donselkirk || true
          fi
          commit_sha="$(git rev-parse HEAD)"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${commit_sha}" \
            -f state="success" \
            -f context="ArrSuite upstream review" \
            -f description="Automated helper review passed"
          gh pr view "$REVIEW_BRANCH" --json url --jq '"Review PR: " + .url' >>"$GITHUB_STEP_SUMMARY"

      - name: Create Codex application-review task
        if: steps.prepare.outputs.state == 'candidate' && steps.prepare.outputs.exit_code == '0' && steps.prepare.outputs.application_changes == 'true'
        id: codex_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fingerprint="$(sha256sum upstream-review/pending.md | cut -c1-12)"
          title="chore: adapt Community Scripts upstream changes (${fingerprint})"
          issue_number="$(gh issue list --state open --search "${title} in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)"
          if [[ -z "$issue_number" ]]; then
            issue_url="$(gh issue create --title "$title" --body-file upstream-report/agent-body.md --assignee donselkirk)"
            issue_number="${issue_url##*/}"
          else
            gh issue edit "$issue_number" --body-file upstream-report/agent-body.md --add-assignee donselkirk
          fi
          echo "fingerprint=$fingerprint" >>"$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >>"$GITHUB_OUTPUT"
          echo "Codex task: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${issue_number}" >>"$GITHUB_STEP_SUMMARY"

      - name: Require OpenAI API key
        if: steps.codex_issue.outputs.issue_number != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "Add an OPENAI_API_KEY repository secret for the Codex GitHub Action." >&2
            exit 1
          fi

      - name: Adapt application changes with Codex
        if: steps.codex_issue.outputs.issue_number != ''
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/upstream-review.md
          output-file: upstream-report/codex-summary.md
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      - name: Validate Codex application adaptation
        if: steps.codex_issue.outputs.issue_number != ''
        run: |
          if [[ -e upstream-review/pending.md ]]; then
            echo "Codex left application adaptations pending; no PR will be created." >&2
            exit 1
          fi

          while IFS=$'\t' read -r app kind repository path old_blob new_blob; do
            actual_blob="$(jq -r --arg app "$app" --arg kind "$kind" '.applications[$app][$kind].blob' tools/upstream-lock.json)"
            if [[ "$actual_blob" != "$new_blob" ]]; then
              echo "Codex did not lock reviewed ${app} ${kind} change ${old_blob} -> ${new_blob} (${repository}/${path})." >&2
              exit 1
            fi
          done <upstream-report/application-changes.tsv

          while IFS= read -r changed_path; do
            case "$changed_path" in
              apps/*.sh|templates/*|src/*|tools/upstream-lock.json|tools/arrsuite-manager|tools/arrsuite-motd.sh|install/arrsuite-install.sh|tests/*|README.md|json/arrsuite.json|wiki/*|vendor/community-scripts/misc/*|upstream-review/pending.md)
                ;;
              *)
                echo "Codex changed disallowed path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <({ git diff --name-only; git ls-files --others --exclude-standard | grep -v '^upstream-report/'; } | sort -u)

          bash tools/build-artifacts.sh
          bash tests/static-checks.sh
          git diff --check

      - name: Create or refresh Codex draft PR
        if: steps.codex_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.codex_issue.outputs.issue_number }}
          FINGERPRINT: ${{ steps.codex_issue.outputs.fingerprint }}
        run: |
          review_branch="automation/upstream-codex-${FINGERPRINT}"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$review_branch"
          git add -A -- \
            apps templates src tools/upstream-lock.json tools/arrsuite-manager \
            tools/arrsuite-motd.sh install/arrsuite-install.sh tests README.md \
            json/arrsuite.json wiki vendor/community-scripts/misc
          git commit -m "chore: adapt Community Scripts application changes"
          git fetch origin "${review_branch}:refs/remotes/origin/${review_branch}" || true
          git push --force-with-lease origin "HEAD:refs/heads/${review_branch}"

          {
            printf '## Codex Community Scripts application review\n\n'
            cat upstream-report/summary.md
            printf '\n## Codex summary\n\n'
            cat upstream-report/codex-summary.md
            printf '\nCloses #%s\n\n' "$ISSUE_NUMBER"
            printf 'This draft PR was generated by the weekly review and Codex, validated independently, and must be reviewed and merged manually.\n'
          } >upstream-report/codex-pr-body.md

          pr_number="$(gh pr list --head "$review_branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --draft \
              --base main \
              --head "$review_branch" \
              --title "chore: adapt Community Scripts application changes" \
              --body-file upstream-report/codex-pr-body.md \
              --assignee donselkirk \
              --reviewer donselkirk
          else
            gh pr edit "$pr_number" \
              --body-file upstream-report/codex-pr-body.md \
              --add-assignee donselkirk
            gh pr edit "$pr_number" --add-reviewer donselkirk || true
          fi
          gh pr view "$review_branch" --json url --jq '"Codex draft PR: " + .url' >>"$GITHUB_STEP_SUMMARY"

      - name: Require attention on unsafe or incomplete review
        if: steps.prepare.outputs.exit_code != '0'
        run: |
          echo "The automated upstream review could not safely generate a candidate. Review the workflow report artifact." >&2
          exit 1
