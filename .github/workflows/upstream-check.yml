name: Weekly Community Scripts Maintenance
run-name: ${{ github.event_name == 'schedule' && 'Weekly upstream detection, Codex adaptation, and PR preparation' || 'Manual upstream detection, Codex adaptation, and PR preparation' }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: arrsuite-upstream-review
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Detect upstream changes, adapt safely, verify, and propose a PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out main without retaining push credentials
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install ShellCheck and ripgrep verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep

      - name: Refresh any existing helper-review branch from main
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: automation/upstream-review
        run: |
          resumed=false
          pr_number="$(gh pr list --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin "${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
            git checkout -B "$REVIEW_BRANCH" "origin/${REVIEW_BRANCH}"
            git merge --no-edit origin/main
            resumed=true
          fi
          echo "resumed=$resumed" >>"$GITHUB_OUTPUT"

      - name: Detect and classify Community Scripts changes
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash tools/prepare-upstream-review.sh
          result=$?
          set -e
          state="failure"
          application_changes="false"
          [[ -r upstream-report/result.env ]] && source upstream-report/result.env
          echo "state=$state" >>"$GITHUB_OUTPUT"
          echo "application_changes=$application_changes" >>"$GITHUB_OUTPUT"
          echo "exit_code=$result" >>"$GITHUB_OUTPUT"

      - name: Add the detection report to the run summary
        if: always()
        run: |
          if [[ -r upstream-report/summary.md ]]; then
            cat upstream-report/summary.md >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Upstream review stopped before a report could be generated." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload focused diffs and local repair instructions
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: community-scripts-upstream-report
          path: upstream-report/

      - name: Verify the deterministic candidate before any PR update
        id: validate_candidate
        if: steps.prepare.outputs.state == 'candidate' && steps.prepare.outputs.exit_code == '0'
        env:
          ARRSUITE_ALLOW_PENDING_UPSTREAM_REVIEW: "1"
        run: |
          bash tools/build-artifacts.sh
          bash tests/static-checks.sh
          git diff --check

      - name: Publish a merge-ready PR for helper-only changes
        id: review_pr
        if: steps.prepare.outputs.state == 'candidate' && steps.prepare.outputs.exit_code == '0' && steps.prepare.outputs.application_changes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BRANCH: automation/upstream-review
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.resume.outputs.resumed }}" != "true" ]]; then
            git fetch origin "${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}" || true
            git checkout -B "$REVIEW_BRANCH"
          fi
          git add tools/upstream-lock.json vendor/community-scripts/misc
          if ! git diff --cached --quiet; then
            git commit -m "chore: review Community Scripts upstream changes"
          fi
          if [[ "${{ steps.resume.outputs.resumed }}" == "true" ]]; then
            if [[ "$(git rev-list --count "origin/${REVIEW_BRANCH}..HEAD")" -gt 0 ]]; then
              git push origin "HEAD:refs/heads/${REVIEW_BRANCH}"
            fi
          else
            git push --force-with-lease origin "HEAD:refs/heads/${REVIEW_BRANCH}"
          fi

          pr_number="$(gh pr list --head "$REVIEW_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$REVIEW_BRANCH" \
              --title "chore: review Community Scripts upstream changes" \
              --body-file upstream-report/pr-body.md \
              --assignee donselkirk
          else
            gh pr edit "$pr_number" \
              --body-file upstream-report/pr-body.md \
              --add-assignee donselkirk
          fi
          commit_sha="$(git rev-parse HEAD)"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${commit_sha}" \
            -f state="success" \
            -f context="ArrSuite upstream review" \
            -f description="Automated helper review passed"
          gh pr view "$REVIEW_BRANCH" --json url --jq '"Review PR: " + .url' >>"$GITHUB_STEP_SUMMARY"

      - name: Fingerprint semantic application changes for Codex
        if: steps.prepare.outputs.state == 'candidate' && steps.prepare.outputs.exit_code == '0' && steps.prepare.outputs.application_changes == 'true'
        id: codex_task
        run: |
          fingerprint="$(sha256sum upstream-review/pending.md | cut -c1-12)"
          echo "fingerprint=$fingerprint" >>"$GITHUB_OUTPUT"
          echo "Codex review fingerprint: ${fingerprint}" >>"$GITHUB_STEP_SUMMARY"

      - name: Confirm the OpenAI API credential is configured
        id: api_key
        if: steps.codex_task.outputs.fingerprint != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "Add an OPENAI_API_KEY repository secret for the Codex GitHub Action." >&2
            exit 1
          fi

      - name: Ask Codex to adapt semantic application changes
        if: steps.codex_task.outputs.fingerprint != ''
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/upstream-review.md
          output-file: upstream-report/codex-summary.md
          sandbox: workspace-write
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      - name: Independently verify the Codex adaptation and changed paths
        id: validate_codex
        if: steps.codex_task.outputs.fingerprint != ''
        run: |
          if [[ -e upstream-review/pending.md ]]; then
            echo "Codex left application adaptations pending; no PR will be created." >&2
            exit 1
          fi

          while IFS=$'\t' read -r app kind repository path old_blob new_blob; do
            actual_blob="$(jq -r --arg app "$app" --arg kind "$kind" '.applications[$app][$kind].blob' tools/upstream-lock.json)"
            if [[ "$actual_blob" != "$new_blob" ]]; then
              echo "Codex did not lock reviewed ${app} ${kind} change ${old_blob} -> ${new_blob} (${repository}/${path})." >&2
              exit 1
            fi
          done <upstream-report/application-changes.tsv

          while IFS= read -r changed_path; do
            case "$changed_path" in
              apps/*.sh|templates/*|src/*|tools/upstream-lock.json|tools/arrsuite-manager|tools/arrsuite-motd.sh|install/arrsuite-install.sh|tests/*|README.md|json/arrsuite.json|wiki/*|vendor/community-scripts/misc/*|upstream-review/pending.md)
                ;;
              *)
                echo "Codex changed disallowed path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <({ git diff --name-only; git ls-files --others --exclude-standard | grep -v '^upstream-report/'; } | sort -u)

          bash tools/build-artifacts.sh
          bash tests/static-checks.sh
          git diff --check

      - name: Publish the verified Codex adaptation as a merge-ready PR
        id: codex_pr
        if: steps.codex_task.outputs.fingerprint != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.codex_task.outputs.fingerprint }}
        run: |
          review_branch="automation/upstream-codex-${FINGERPRINT}"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$review_branch"
          git add -A -- \
            apps templates src tools/upstream-lock.json tools/arrsuite-manager \
            tools/arrsuite-motd.sh install/arrsuite-install.sh tests README.md \
            json/arrsuite.json wiki vendor/community-scripts/misc
          git commit -m "chore: adapt Community Scripts application changes"
          git fetch origin "${review_branch}:refs/remotes/origin/${review_branch}" || true
          git push --force-with-lease origin "HEAD:refs/heads/${review_branch}"

          {
            printf '## Codex Community Scripts application review\n\n'
            cat upstream-report/summary.md
            printf '\n## Codex summary\n\n'
            cat upstream-report/codex-summary.md
            printf 'This merge-ready PR was generated by the weekly review and Codex and validated independently. It can only be merged manually.\n'
          } >upstream-report/codex-pr-body.md

          pr_number="$(gh pr list --head "$review_branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$review_branch" \
              --title "chore: adapt Community Scripts application changes" \
              --body-file upstream-report/codex-pr-body.md \
              --assignee donselkirk
          else
            gh pr edit "$pr_number" \
              --body-file upstream-report/codex-pr-body.md \
              --add-assignee donselkirk
            gh pr ready "$pr_number" || true
          fi
          gh pr view "$review_branch" --json url --jq '"Codex merge-ready PR: " + .url' >>"$GITHUB_STEP_SUMMARY"

      - name: Fail when no safe upstream candidate could be produced
        id: require_attention
        if: steps.prepare.outputs.exit_code != '0'
        run: |
          echo "The automated upstream review could not safely generate a candidate. Review the workflow report artifact." >&2
          exit 1

      - name: Create or refresh an assigned upstream repair issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "automation: weekly upstream maintenance needs attention"
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          VALIDATE_CANDIDATE_OUTCOME: ${{ steps.validate_candidate.outcome }}
          API_KEY_OUTCOME: ${{ steps.api_key.outcome }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          VALIDATE_CODEX_OUTCOME: ${{ steps.validate_codex.outcome }}
          REVIEW_PR_OUTCOME: ${{ steps.review_pr.outcome }}
          CODEX_PR_OUTCOME: ${{ steps.codex_pr.outcome }}
        run: |
          gh label create automation --color 1D76DB --description "Created or maintained by automation" --force
          gh label create needs-local-codex --color D93F0B --description "Needs local Codex investigation" --force
          {
            printf '## Weekly upstream maintenance failed\n\n'
            printf -- '- Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Report artifact: `community-scripts-upstream-report`\n\n'
            printf '### Stage outcomes\n\n'
            printf -- '- Prepare: `%s`\n- Candidate validation: `%s`\n- API key check: `%s`\n' \
              "$PREPARE_OUTCOME" "$VALIDATE_CANDIDATE_OUTCOME" "$API_KEY_OUTCOME"
            printf -- '- Codex: `%s`\n- Codex validation: `%s`\n- Helper PR: `%s`\n- Codex PR: `%s`\n\n' \
              "$CODEX_OUTCOME" "$VALIDATE_CODEX_OUTCOME" "$REVIEW_PR_OUTCOME" "$CODEX_PR_OUTCOME"
            if [[ -r upstream-report/summary.md ]]; then
              printf '### Upstream summary\n\n'
              cat upstream-report/summary.md
              printf '\n'
            fi
            if [[ -r upstream-report/agent-body.md ]]; then
              printf '### Local Codex repair instructions\n\n'
              cat upstream-report/agent-body.md
              printf '\n'
            else
              printf '### Local Codex repair instructions\n\n'
              printf 'Inspect the linked run and report artifact, reproduce with `bash tools/prepare-upstream-review.sh`, make the repair on a branch, run `bash tests/static-checks.sh` and `git diff --check`, then open a PR that closes this issue.\n'
            fi
          } >upstream-report/failure-issue.md
          issue_number="$(gh issue list --state open --search "${ISSUE_TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1)"
          if [[ -z "$issue_number" ]]; then
            gh issue create --title "$ISSUE_TITLE" --body-file upstream-report/failure-issue.md \
              --assignee donselkirk --label automation --label needs-local-codex
          else
            gh issue edit "$issue_number" --body-file upstream-report/failure-issue.md \
              --add-assignee donselkirk --add-label automation --add-label needs-local-codex
          fi

      - name: Close any recovered upstream repair issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "automation: weekly upstream maintenance needs attention"
        run: |
          issue_number="$(gh issue list --state open --search "${ISSUE_TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1)"
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --comment "Recovered automatically in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
