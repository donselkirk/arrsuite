name: Documentation Wiki Publication
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manually publish repository documentation to the Wiki' || format('Publish merged documentation to the Wiki · {0}', github.event.head_commit.message) }}

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**/*.md"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arrsuite-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish the repository Wiki pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation source commit
        uses: actions/checkout@v7.0.1

      - name: Verify every Wiki page has valid content and a title
        run: |
          test -s wiki/Home.md
          for page in wiki/*.md; do
            grep -q '^# ' "$page" || {
              echo "Wiki page has no top-level heading: $page" >&2
              exit 1
            }
          done

      - name: Synchronize the verified pages to the GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            /tmp/arrsuite-wiki
          find /tmp/arrsuite-wiki -maxdepth 1 -type f -name '*.md' -delete
          cp wiki/*.md /tmp/arrsuite-wiki/
          cd /tmp/arrsuite-wiki
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is already current."
          else
            git commit -m "docs: publish wiki from ${GITHUB_SHA}"
            git push origin HEAD:master
          fi
